name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Release x64
        shell: cmd
        run: msbuild Osiris.sln /p:Platform=x64 /p:Configuration=Release

      - name: Find Osiris.dll
        shell: powershell
        run: |
          $dll = Get-ChildItem -Path . -Filter Osiris.dll -Recurse | Select-Object -First 1
          if ($null -eq $dll) {
            Write-Error "Osiris.dll was not found"
            exit 1
          }
          Write-Host "Found: $($dll.FullName)"

      - name: Upload Osiris.dll
        uses: actions/upload-artifact@v4
        with:
          name: Osiris-Windows-x64
          path: '**/Osiris.dll'
          if-no-files-found: error
